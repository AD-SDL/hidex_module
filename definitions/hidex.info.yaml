node_name: hidex
node_id: 01JWHD6HPNXMCKNHZK53VYVNQH
node_description: A rest node for Hidex Module
node_type: device
module_name: hidex_module
module_version: 0.0.1
capabilities:
  get_info: true
  get_state: true
  get_status: true
  send_action: true
  get_action_result: true
  get_action_history: true
  action_files: true
  send_admin_commands: true
  set_config: true
  get_resources: false
  get_log: true
  admin_commands:
  - cancel
  - lock
  - reset
  - shutdown
  - unlock
node_url: null
actions:
  open:
    name: open
    description: opens plate carrier
    args: {}
    locations: {}
    files: {}
    results: {}
    blocking: false
    asynchronous: true
  close:
    name: close
    description: closes plate carrier
    args: {}
    locations: {}
    files: {}
    results: {}
    blocking: false
    asynchronous: true
  run_assay:
    name: run_assay
    description: runs assay on the current sample
    args:
      assay_name:
        name: assay_name
        description: assay to run
        argument_type: str
        required: true
        default: null
      wait_for_result:
        name: wait_for_result
        description: Whether we should wait for the results of the assay before returning
        argument_type: bool
        required: false
        default: true
    locations: {}
    files: {}
    results: {}
    blocking: false
    asynchronous: true
config:
  node_definition: definitions/hidex.node.yaml
  node_info_path: null
  update_node_files: true
  status_update_interval: 2.0
  state_update_interval: 2.0
  node_url: http://127.0.0.1:2000/
  uvicorn_kwargs: {}
  output_path: C:\Users\svcaibio\Desktop\results
config_schema:
  description: Configuration for the Hidex REST node
  properties:
    node_definition:
      anyOf:
      - type: string
      - format: path
        type: string
      - type: 'null'
      default: default.node.yaml
      description: Path to the node definition file to use. If set, the node will
        load the definition from this file on startup. Otherwise, a default configuration
        will be created.
      title: Node Definition File
    node_info_path:
      anyOf:
      - type: string
      - format: path
        type: string
      - type: 'null'
      default: null
      description: Path to export the generated node info file. If not set, will use
        the node name and the node_definition's path.
      title: Node Info Path
    update_node_files:
      default: true
      description: Whether to update the node definition and info files on startup.
        If set to False, the node will not update the files even if they are out of
        date.
      title: Update Node Files
      type: boolean
    status_update_interval:
      anyOf:
      - type: number
      - type: 'null'
      default: 2.0
      description: The interval in seconds at which the node should update its status.
      title: Status Update Interval
    state_update_interval:
      anyOf:
      - type: number
      - type: 'null'
      default: 2.0
      description: The interval in seconds at which the node should update its state.
      title: State Update Interval
    node_url:
      default: http://127.0.0.1:2000/
      description: The URL used to communicate with the node. This is the base URL
        for the REST API.
      format: uri
      minLength: 1
      title: Node URL
      type: string
    uvicorn_kwargs:
      additionalProperties: true
      description: Configuration for the Uvicorn server that runs the REST API.
      title: Uvicorn Configuration
      type: object
    output_path:
      anyOf:
      - type: string
      - type: 'null'
      default: C:\Users\svcaibio\Desktop\results
      title: Output Path
  title: HidexNodeConfig
  type: object
